<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MODL Climate Action Dashboard</title>
<style>
  html, body { margin:0; padding:0; height:100%; background:#fff; overflow-x:hidden; }
  /* #clip is exactly the visible width and hides the scrollbar gutter that
     #wrap deliberately overhangs by. */
  #clip {
    width:100%; overflow:hidden;
    height:100vh;   /* fallback */
    height:100dvh;  /* mobile: excludes the collapsing URL bar */
  }
  #wrap  { height:100%; }
  #frame { width:100%; height:100%; border:0; display:block; }
  /* No transform / scale() anywhere. That is what caused the grain. */
  #dbg {
    position:fixed; top:0; left:0; right:0; z-index:9;
    background:#111; color:#0f0; font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;
    padding:8px 10px; white-space:pre-wrap; word-break:break-all; margin:0;
  }
</style>
</head>
<body>

<div id="clip"><div id="wrap">
  <iframe id="frame" title="MODL Climate Action Dashboard" allowfullscreen></iframe>
</div></div>
<pre id="dbg" hidden></pre>
<noscript>
  <p style="font:16px system-ui;padding:16px">
    <a href="https://app.powerbi.com/view?r=eyJrIjoiMzIzMDk4YTktOGU2ZC00MzIwLTlkNDktNGYzMWJmNjBmMDgzIiwidCI6IjdlNWUyZWU0LWQyMTItNDdkNC05OTA5LTk5NWY4NzlkMWFhMSJ9">Open the MODL Climate Action Dashboard</a>
  </p>
</noscript>

<script>
(function () {

  var BUILD = '2026-09-09d';

  var BASE = 'https://app.powerbi.com/view?r=eyJrIjoiMzIzMDk4YTktOGU2ZC00MzIwLTlkNDktNGYzMWJmNjBmMDgzIiwidCI6IjdlNWUyZWU0LWQyMTItNDdkNC05OTA5LTk5NWY4NzlkMWFhMSJ9';

  var PAGE = {
    mobile:  '354e8f1298152bebcee7',   // Mobile Home
    desktop: '2c8e7e34f76a2e4428bc'    // Desktop Home
  };

  // --- the numbers you might want to change ---------------------------------
  var BREAKPOINT   = 768;   // window width below this = mobile layout
  var DESKTOP_MAX  = 1280;  // report is authored at 1280; 1:1 is sharpest.
                            // Set to 99999 for full-bleed on wide monitors.

  // Power BI reserves this much inside the iframe for its vertical scrollbar,
  // which is what leaves the white strip down the right. We overhang the iframe
  // by the same amount and clip it, so the report fills the screen instead.
  // Measured 18 on iPhone (402px wide, 117% => 402-18=384, 384/328=117%).
  // Override live with ?res=N to retune. 0 disables the compensation.
  var MOBILE_RESERVE  = 18;
  var DESKTOP_RESERVE = 0;  // left at 0 so mouse users keep a visible scrollbar
  // --------------------------------------------------------------------------

  var q = new URLSearchParams(location.search);

  var vw = window.innerWidth || document.documentElement.clientWidth;
  var forced = q.get('view');
  var isMobile = forced ? (forced === 'mobile') : (vw < BREAKPOINT);

  var reserve = q.get('res') !== null
    ? parseInt(q.get('res'), 10) || 0
    : (isMobile ? MOBILE_RESERVE : DESKTOP_RESERVE);

  // Width the report should actually occupy on screen.
  var target = isMobile ? vw : Math.min(DESKTOP_MAX, vw);

  var clip  = document.getElementById('clip'),
      wrap  = document.getElementById('wrap'),
      frame = document.getElementById('frame');

  wrap.style.width      = (target + reserve) + 'px';
  wrap.style.marginLeft = Math.max(0, Math.round((vw - target) / 2)) + 'px';

  var pageName = PAGE[isMobile ? 'mobile' : 'desktop'];
  frame.src = BASE + '&pageName=' + pageName;

  if (q.get('debug')) {
    var d = document.getElementById('dbg');
    d.hidden = false;
    clip.style.height = 'calc(100dvh - 130px)';
    setTimeout(function () {
      d.textContent =
        'build          ' + BUILD + '\n' +
        'innerWidth     ' + vw + (forced ? '  (?view=' + forced + ')' : '') + '\n' +
        'branch         ' + (isMobile ? 'MOBILE' : 'DESKTOP') + '\n' +
        'pageName sent  ' + pageName + '\n' +
        'reserve        ' + reserve + '   (?res=N to retune)\n' +
        'iframe width   ' + frame.clientWidth + '  visible ' + target + '\n' +
        'expect zoom    ' + Math.round(target / (isMobile ? 328 : 1280) * 100) + '%';
    }, 400);
  }

  // Deliberately no resize handler: changing the page would reload the report
  // and throw away whatever the visitor had open.
})();
</script>

</body>
</html>
